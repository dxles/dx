<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nowtify</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--accent:#1db954;}
body{font-family:'Montserrat',sans-serif;background:#121212;color:#fff;height:100vh;overflow:hidden;display:flex;justify-content:flex-start;align-items:center;pointer-events:none;}
#background{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(35px) brightness(0.35);z-index:0;transition:background-image 0.8s ease,opacity 0.5s ease;}

#main{position:relative;z-index:1;display:none;align-items:center;margin-left:50px;opacity:0;transition:opacity 0.5s ease;}
#main.visible{opacity:1;}
#album-img{width:250px;height:250px;object-fit:cover;border-radius:15px;box-shadow:0 20px 50px rgba(0,0,0,0.7);flex-shrink:0;}
#info{margin-left:40px;display:flex;flex-direction:column;justify-content:center;}
#song-name{font-size:2em;font-weight:700;margin-bottom:8px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#artist{font-size:1.2em;color:#ccc;margin-bottom:16px;}
#progress-container{width:340px;}
#progress{width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:5px;overflow:hidden;}
#progress-bar{height:100%;width:0%;background:var(--accent);transition:width 0.25s linear;}
#time-info{display:flex;justify-content:space-between;font-size:0.8em;color:#aaa;margin-top:6px;}

#eq{position:fixed;bottom:40px;left:50px;z-index:2;display:flex;align-items:flex-end;height:34px;gap:4px;opacity:0;transition:opacity 0.5s ease;}
#eq.active{opacity:1;}
.bar{width:7px;height:5px;background:var(--accent);border-radius:2px;transform-origin:bottom;transition:height 0.08s linear;}

#lyrics{position:fixed;top:50%;right:50px;transform:translateY(-50%);width:560px;height:78vh;max-height:680px;overflow-y:scroll;padding:20px 10px 20px 0;z-index:2;opacity:0;pointer-events:none;transition:opacity 0.5s ease;scrollbar-width:thin;scrollbar-color:var(--accent) transparent;}
#lyrics::-webkit-scrollbar{width:5px;}
#lyrics::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}
#lyrics.visible{opacity:1;}
.ll{font-size:1.45em;font-weight:500;color:rgba(255,255,255,0.3);margin-bottom:28px;line-height:1.45;transition:all 0.3s ease;}
.ll:last-child{margin-bottom:320px;}
.la{font-size:1.9em;color:#fff;font-weight:700;}

#no-track{position:relative;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;gap:12px;text-align:center;}
#no-track svg{opacity:0.3;}
#no-track p{color:#aaa;font-size:1em;}

#login{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100;pointer-events:auto;transition:opacity 0.5s ease;}
#login h2{font-size:2em;font-weight:700;letter-spacing:-0.02em;}
#login h2 span{color:var(--accent);}
#login p{color:#aaa;font-size:0.9em;}
#login-btn{background:var(--accent);color:#000;border:none;padding:16px 48px;border-radius:50px;font-size:1.1em;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;box-shadow:0 10px 30px rgba(29,185,84,0.35);transition:all 0.3s ease;margin-top:8px;}
#login-btn:hover{transform:scale(1.06);}
#lfm-input{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#fff;font-family:'Montserrat',sans-serif;font-size:1em;padding:13px 22px;border-radius:50px;outline:none;width:260px;text-align:center;}
</style>
</head>
<body>

<div id="background"></div>

<div id="main">
  <img id="album-img" src="" alt=""/>
  <div id="info">
    <div id="song-name"></div>
    <div id="artist"></div>
    <div id="progress-container">
      <div id="progress"><div id="progress-bar"></div></div>
      <div id="time-info">
        <span id="cur">0:00</span>
        <span id="dur">0:00</span>
      </div>
    </div>
  </div>
</div>

<div id="no-track">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z"/>
  </svg>
  <p>Şu an hiçbir şey çalmıyor</p>
</div>

<div id="eq">
  <div class="bar"></div><div class="bar"></div>
  <div class="bar"></div><div class="bar"></div>
</div>

<div id="lyrics"></div>

<div id="login">
  <h2>now<span>tify</span></h2>
  <p>Last.fm kullanıcı adını gir</p>
  <input id="lfm-input" type="text" placeholder="kullanıcı adı"/>
  <button id="login-btn">Başla</button>
  <p style="font-size:0.75em;opacity:0.4;">Spotify → Last.fm scrobbling aktif olmalı</p>
</div>

<script>
const LFM_KEY = '7f7181bf02aa309352cf0bb2f05bb299';
const POLL_MS = 5000;

const bg      = document.getElementById('background');
const mainEl  = document.getElementById('main');
const noEl    = document.getElementById('no-track');
const imgEl   = document.getElementById('album-img');
const nameEl  = document.getElementById('song-name');
const artEl   = document.getElementById('artist');
const pBar    = document.getElementById('progress-bar');
const curEl   = document.getElementById('cur');
const durEl   = document.getElementById('dur');
const eqEl    = document.getElementById('eq');
const lyrEl   = document.getElementById('lyrics');
const loginEl = document.getElementById('login');
const loginBtn= document.getElementById('login-btn');
const input   = document.getElementById('lfm-input');
const bars    = document.querySelectorAll('.bar');

let user        = localStorage.getItem('lfm_user') || '';
let trackKey    = '';
let curMs       = 0;
let durMs       = 0;
let playing     = false;
let lrcData     = [];
let activeIdx   = -1;
let lastScrollIdx = -1;
let progTimer   = null;
let eqTimer     = null;
let lyricTimer  = null;
let pollTimer   = null;

/* ── utils ── */
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

/* ── lrclib: ana fetch ── */
async function getLyrics(artist, track) {
  // 1. search endpoint — en güvenilir, duration bilmeden de çalışıyor
  try {
    const r = await fetch(
      `https://lrclib.net/api/search?q=${encodeURIComponent(artist + ' ' + track)}`
    );
    if (r.ok) {
      const list = await r.json();
      if (Array.isArray(list) && list.length) {
        // En iyi eşleşmeyi bul: artist ve track adı içeren
        const hit = list.find(x =>
          x.artistName?.toLowerCase().includes(artist.toLowerCase()) &&
          x.trackName?.toLowerCase().includes(track.toLowerCase())
        ) || list[0];

        // lrclib'in duration'ını kullan (saniye cinsinden gelir)
        if (hit.duration && hit.duration > 10) {
          durMs = Math.round(hit.duration) * 1000;
        }

        if (hit.syncedLyrics) return parseLRC(hit.syncedLyrics);
        if (hit.plainLyrics)  return plainLRC(hit.plainLyrics);
      }
    }
  } catch(_) {}

  // 2. get endpoint fallback
  try {
    const r = await fetch(
      `https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}`
    );
    if (r.ok) {
      const d = await r.json();
      if (d.duration && d.duration > 10) durMs = Math.round(d.duration) * 1000;
      if (d.syncedLyrics) return parseLRC(d.syncedLyrics);
      if (d.plainLyrics)  return plainLRC(d.plainLyrics);
    }
  } catch(_) {}

  return [];
}

function parseLRC(raw) {
  const out = [];
  for (const line of raw.split('\n')) {
    const m = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
    if (!m) continue;
    const ms   = parseInt(m[1])*60000 + parseFloat(m[2])*1000;
    const text = m[3].trim();
    if (text) out.push({ ms, text });
  }
  return out.sort((a,b) => a.ms - b.ms);
}

function plainLRC(raw) {
  // Düz sözler için timestamp yok — sadece göster, sync olmaz
  return raw.split('\n').filter(l => l.trim()).map((text, i) => ({ ms: i * 3000, text }));
}

/* ── lyrics render / sync ── */
function renderLyrics(data) {
  lrcData     = data;
  activeIdx   = -1;
  lastScrollIdx = -1;
  if (!data.length) {
    lyrEl.innerHTML = '<div class="ll" style="color:rgba(255,255,255,0.2);text-align:center;">Sözler bulunamadı.</div>';
    return;
  }
  lyrEl.innerHTML = data.map((l,i) => `<div class="ll" data-i="${i}">${l.text}</div>`).join('');
  lyrEl.scrollTop = 0;
}

function syncLyrics() {
  if (!lrcData.length) return;
  let idx = -1;
  for (let i = 0; i < lrcData.length; i++) {
    if (curMs >= lrcData[i].ms) idx = i; else break;
  }
  if (idx < 0 || idx === activeIdx) return;
  lyrEl.querySelector('.la')?.classList.remove('la');
  activeIdx = idx;
  const el = lyrEl.querySelector(`[data-i="${idx}"]`);
  if (!el) return;
  el.classList.add('la');
  if (idx !== lastScrollIdx) {
    lastScrollIdx = idx;
    lyrEl.scrollTo({ top: el.offsetTop - lyrEl.clientHeight/2 + el.clientHeight/2, behavior:'smooth' });
  }
}

/* ── eq animation ── */
function startEq() {
  if (eqTimer) return;
  eqEl.classList.add('active');
  eqTimer = setInterval(() => bars.forEach(b => { b.style.height = (4 + Math.random()*26)+'px'; }), 90);
}
function stopEq() {
  clearInterval(eqTimer); eqTimer = null;
  eqEl.classList.remove('active');
  bars.forEach(b => { b.style.height = '5px'; });
}

/* ── progress tick ── */
function startProg() {
  if (progTimer) return;
  if (durMs <= 0) return;
  progTimer = setInterval(() => {
    curMs = Math.min(curMs + 250, durMs);
    drawProg();
  }, 250);
}
function stopProg() { clearInterval(progTimer); progTimer = null; }
function drawProg() {
  pBar.style.width = durMs > 0 ? (curMs/durMs*100)+'%' : '0%';
  curEl.textContent = fmt(curMs);
  durEl.textContent = fmt(durMs);
}

/* ── lyric sync ticker ── */
function startSync() {
  if (lyricTimer) return;
  lyricTimer = setInterval(syncLyrics, 100);
}
function stopSync() { clearInterval(lyricTimer); lyricTimer = null; lyrEl.querySelector('.la')?.classList.remove('la'); }

/* ── states ── */
function showNoTrack() {
  mainEl.style.display = 'none'; mainEl.classList.remove('visible');
  noEl.style.display   = 'flex';
  bg.style.backgroundImage = '';
  stopEq(); stopProg(); stopSync();
  lyrEl.classList.remove('visible');
  trackKey = ''; curMs = 0; durMs = 0; drawProg();
}

function handleTrack(t) {
  const name    = t.name;
  const artist  = t.artist['#text'];
  const img     = t.image?.find(i => i.size === 'extralarge')?.['#text'] || '';
  const nowPlay = t['@attr']?.nowplaying === 'true';
  playing = nowPlay;

  if (!nowPlay) { showNoTrack(); return; }

  noEl.style.display  = 'none';
  mainEl.style.display= 'flex';
  setTimeout(() => mainEl.classList.add('visible'), 30);
  nameEl.textContent  = name;
  artEl.textContent   = artist;
  if (img) { imgEl.src = img; bg.style.backgroundImage = `url(${img})`; }
  lyrEl.classList.add('visible');
  startEq();

  const key = `${artist}|||${name}`;
  if (key === trackKey) {
    startProg(); startSync(); return;
  }

  // Yeni şarkı — duration'ı hemen metadata'dan al, progress anında başlasın
  trackKey = key;
  curMs = 0;
  // recenttracks'te duration ms cinsinden gelir (bazen 0 veya eksik olabilir)
  const rawDur = parseInt(t.duration);
  durMs = (!isNaN(rawDur) && rawDur > 1000) ? rawDur : 0;
  stopProg(); stopSync();
  drawProg();
  startProg(); // duration varsa hemen başlar, yoksa lrc gelince düzeltilir

  lyrEl.innerHTML = '<div class="ll" style="color:rgba(255,255,255,0.2);text-align:center;">Sözler yükleniyor…</div>';

  // Lyrics arka planda yükle
  getLyrics(artist, name).then(data => {
    // getLyrics içinde durMs lrclib'den set edilmiş olabilir — daha doğruysa kullan
    renderLyrics(data);
    drawProg();
    if (!progTimer && durMs > 0) startProg();
    startSync();
  });
}


/* ── poll ── */
async function poll() {
  try {
    const r = await fetch(
      `https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(user)}&api_key=${LFM_KEY}&format=json&limit=1`
    );
    if (!r.ok) return;
    const d = await r.json();
    const tracks = d.recenttracks?.track;
    if (!tracks?.length) { showNoTrack(); return; }
    handleTrack(Array.isArray(tracks) ? tracks[0] : tracks);
  } catch(_) {}
}

/* ── login ── */
function startApp() {
  loginEl.style.opacity = '0';
  setTimeout(() => { loginEl.style.display = 'none'; }, 500);
  poll();
  pollTimer = setInterval(poll, POLL_MS);
}

loginBtn.addEventListener('click', () => {
  const v = input.value.trim();
  if (!v) return;
  user = v;
  localStorage.setItem('lfm_user', user);
  startApp();
});
input.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); });

window.addEventListener('DOMContentLoaded', () => {
  if (user) { input.value = user; startApp(); }
});
</script>
</body>
</html>
