<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nowtify</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --accent:#1db954;
  --accent-dim:rgba(29,185,84,0.5);
}

body{
  font-family:'Montserrat',sans-serif;
  background:#121212;
  color:#fff;
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:flex-start;
  align-items:center;
  pointer-events:none;
}

#background{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(35px) brightness(0.35);
  z-index:0;
  transition:background-image 0.8s ease, opacity 0.5s ease;
}

#main{
  position:relative;
  z-index:1;
  display:none;
  align-items:center;
  margin-left:50px;
  opacity:0;
  transition:opacity 0.5s ease;
}
#main.visible{opacity:1;}

#album-img{
  width:250px;
  height:250px;
  object-fit:cover;
  border-radius:15px;
  box-shadow:0 20px 50px rgba(0,0,0,0.7);
  flex-shrink:0;
  transition:box-shadow 0.5s ease;
}

#info{
  margin-left:40px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

#song-name{
  font-size:2em;
  font-weight:700;
  margin-bottom:8px;
  max-width:340px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
#artist{font-size:1.2em;color:#ccc;margin-bottom:16px;}

#progress-container{width:340px;}
#progress{width:100%;height:8px;background:rgba(255,255,255,0.15);border-radius:5px;overflow:hidden;}
#progress-bar{height:100%;width:0%;background:var(--accent);transition:width 0.25s linear;}
#time-info{display:flex;justify-content:space-between;font-size:0.8em;color:#aaa;margin-top:6px;}

#equalizer-container{
  position:fixed;
  bottom:40px;
  left:50px;
  z-index:2;
  display:flex;
  align-items:flex-end;
  height:34px;
  gap:4px;
  opacity:0;
  transition:opacity 0.5s ease;
}
#equalizer-container.active{opacity:1;}
.bar{
  width:7px;
  height:5px;
  background:var(--accent);
  border-radius:2px;
  transform-origin:bottom;
  transition:height 0.08s linear, background-color 0.5s ease;
}

#lyrics-container{
  position:fixed;
  top:50%;
  right:50px;
  transform:translateY(-50%);
  width:560px;
  height:78vh;
  max-height:680px;
  overflow-y:scroll;
  padding:20px 10px 20px 0;
  z-index:2;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.5s ease;
  scrollbar-width:thin;
  scrollbar-color:var(--accent) transparent;
}
#lyrics-container::-webkit-scrollbar{width:5px;}
#lyrics-container::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px;}
#lyrics-container.visible{opacity:1;}

.lyric-line{
  font-size:1.45em;
  font-weight:500;
  color:rgba(255,255,255,0.3);
  margin-bottom:28px;
  line-height:1.45;
  transition:all 0.3s ease;
  cursor:default;
}
.lyric-line:last-child{margin-bottom:320px;}
.lyric-active{
  font-size:1.9em;
  color:#fff;
  font-weight:700;
}

#video-container{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  width:88vw;
  max-width:800px;
  height:calc(88vw * 9/16);
  max-height:450px;
  display:none;
  box-shadow:0 0 60px rgba(0,0,0,0.95);
  border-radius:12px;
  overflow:hidden;
  opacity:0;
  transition:opacity 0.6s ease;
}
#video-container.visible{opacity:1;}
#youtube-player{width:100%;height:100%;border:none;}

#video-toggle-btn{
  position:fixed;
  bottom:36px;
  left:50px;
  z-index:20;
  background:rgba(255,255,255,0.12);
  color:#fff;
  border:1px solid rgba(255,255,255,0.25);
  padding:10px 22px;
  border-radius:50px;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
  font-size:0.9em;
  font-weight:700;
  backdrop-filter:blur(8px);
  display:none;
  pointer-events:auto;
  transition:all 0.3s ease;
}
#video-toggle-btn:hover{background:rgba(255,255,255,0.25);}

#unmute-btn{
  position:fixed;
  bottom:36px;
  right:36px;
  z-index:20;
  background:#e63946;
  color:#fff;
  border:none;
  padding:10px 22px;
  border-radius:50px;
  cursor:pointer;
  font-family:'Montserrat',sans-serif;
  font-size:0.9em;
  font-weight:700;
  display:none;
  pointer-events:auto;
  box-shadow:0 4px 18px rgba(0,0,0,0.5);
  transition:background 0.2s;
}
#unmute-btn:hover{background:#c1121f;}

#login-container{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  z-index:100;
  pointer-events:auto;
  transition:opacity 0.5s ease;
}
#login-container h2{font-size:2em;font-weight:700;letter-spacing:-0.02em;}
#login-container h2 span{color:var(--accent);}
#login-container p{color:#aaa;font-size:0.9em;}

#login-btn{
  background:var(--accent);
  color:#000;
  border:none;
  padding:16px 48px;
  border-radius:50px;
  font-size:1.1em;
  font-weight:700;
  font-family:'Montserrat',sans-serif;
  cursor:pointer;
  box-shadow:0 10px 30px rgba(29,185,84,0.35);
  transition:all 0.3s ease;
  margin-top:8px;
}
#login-btn:hover{transform:scale(1.06);box-shadow:0 14px 40px rgba(29,185,84,0.5);}

#no-track{
  position:relative;
  z-index:2;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  gap:12px;
  text-align:center;
}
#no-track svg{opacity:0.3;}
#no-track p{color:#aaa;font-size:1em;}
</style>
</head>
<body>

<div id="background"></div>

<div id="main">
  <img id="album-img" src="" alt=""/>
  <div id="info">
    <div id="song-name"></div>
    <div id="artist"></div>
    <div id="progress-container">
      <div id="progress"><div id="progress-bar"></div></div>
      <div id="time-info">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
    </div>
  </div>
</div>

<div id="no-track">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 9l10.5-3m0 6.553v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 11-.99-3.467l2.31-.66a2.25 2.25 0 001.632-2.163zm0 0V2.25L9 5.25v10.303m0 0v3.75a2.25 2.25 0 01-1.632 2.163l-1.32.377a1.803 1.803 0 01-.99-3.467l2.31-.66A2.25 2.25 0 009 15.553z"/>
  </svg>
  <p>Şu an hiçbir şey çalmıyor</p>
</div>

<div id="equalizer-container">
  <div class="bar" id="b1"></div>
  <div class="bar" id="b2"></div>
  <div class="bar" id="b3"></div>
  <div class="bar" id="b4"></div>
</div>

<div id="lyrics-container"></div>

<div id="video-container">
  <iframe id="youtube-player" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<button id="video-toggle-btn">▶ Video Göster</button>
<button id="unmute-btn">🔇 Sesi Aç</button>

<div id="login-container">
  <h2>now<span>tify</span></h2>
  <p>Last.fm kullanıcı adını gir</p>
  <input id="lfm-input" type="text" placeholder="kullanıcı adı" style="
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    font-family:'Montserrat',sans-serif;
    font-size:1em;
    padding:13px 22px;
    border-radius:50px;
    outline:none;
    width:260px;
    text-align:center;
  "/>
  <button id="login-btn">Başla</button>
  <p style="font-size:0.75em;opacity:0.4;">Spotify → Last.fm scrobbling aktif olmalı</p>
</div>

<script>
  const API_KEY   = '7f7181bf02aa309352cf0bb2f05bb299';
  const POLL_MS   = 4000;

  const bg          = document.getElementById('background');
  const mainEl      = document.getElementById('main');
  const noTrackEl   = document.getElementById('no-track');
  const albumImg    = document.getElementById('album-img');
  const songNameEl  = document.getElementById('song-name');
  const artistEl    = document.getElementById('artist');
  const progressBar = document.getElementById('progress-bar');
  const currentTimeEl   = document.getElementById('current-time');
  const totalDurEl      = document.getElementById('total-duration');
  const eqContainer     = document.getElementById('equalizer-container');
  const lyricsContainer = document.getElementById('lyrics-container');
  const videoContainer  = document.getElementById('video-container');
  const ytIframe        = document.getElementById('youtube-player');
  const videoToggleBtn  = document.getElementById('video-toggle-btn');
  const unmuteBtn       = document.getElementById('unmute-btn');
  const loginContainer  = document.getElementById('login-container');
  const loginBtn        = document.getElementById('login-btn');
  const lfmInput        = document.getElementById('lfm-input');
  const bars            = document.querySelectorAll('.bar');

  let username       = localStorage.getItem('lfm_user') || '';
  let pollTimer      = null;
  let progressTimer  = null;
  let eqTimer        = null;
  let lyricTimer     = null;
  let ytPlayer       = null;
  let ytReady        = false;
  let currentTrackKey = '';
  let currentMs      = 0;
  let durationMs     = 0;
  let isPlaying      = false;
  let lrcData        = [];
  let currentLyricIdx = -1;
  let lastScrolledIdx = -1;
  let videoVisible   = false;
  let currentVideoId = null;

  function fmt(ms) {
    const s = Math.floor(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function parseLRC(lrc) {
    const lines = lrc.split('\n');
    const result = [];
    lines.forEach(line => {
      const m = line.match(/\[(\d+):(\d+\.\d+)\](.*)/);
      if (m) {
        const time = parseInt(m[1]) * 60000 + parseFloat(m[2]) * 1000;
        const text = m[3].trim();
        if (text) result.push({ time, text });
      }
    });
    return result.sort((a, b) => a.time - b.time);
  }

  function renderLyrics(data) {
    lrcData = data;
    currentLyricIdx = -1;
    lastScrolledIdx = -1;
    if (!data.length) {
      lyricsContainer.innerHTML = '<div class="lyric-line" style="color:rgba(255,255,255,0.25);text-align:center;">Sözler bulunamadı.</div>';
      return;
    }
    lyricsContainer.innerHTML = data.map((l, i) =>
      `<div class="lyric-line" data-i="${i}">${l.text}</div>`
    ).join('');
  }

  function syncLyrics() {
    if (!lrcData.length) return;
    let idx = -1;
    for (let i = 0; i < lrcData.length; i++) {
      if (currentMs >= lrcData[i].time) idx = i;
      else break;
    }
    if (idx < 0 || idx === currentLyricIdx) return;
    const prev = lyricsContainer.querySelector('.lyric-active');
    if (prev) prev.classList.remove('lyric-active');
    currentLyricIdx = idx;
    const active = lyricsContainer.querySelector(`[data-i="${idx}"]`);
    if (!active) return;
    active.classList.add('lyric-active');
    if (idx !== lastScrolledIdx) {
      lastScrolledIdx = idx;
      const top = active.offsetTop - lyricsContainer.clientHeight / 2 + active.clientHeight / 2;
      lyricsContainer.scrollTo({ top, behavior: 'smooth' });
    }
  }

  function startLyricSync() {
    if (lyricTimer) clearInterval(lyricTimer);
    lyricTimer = setInterval(syncLyrics, 100);
  }

  function stopLyricSync() {
    if (lyricTimer) clearInterval(lyricTimer);
    lyricTimer = null;
    const a = lyricsContainer.querySelector('.lyric-active');
    if (a) a.classList.remove('lyric-active');
  }

  function startEq() {
    if (eqTimer) clearInterval(eqTimer);
    eqContainer.classList.add('active');
    eqTimer = setInterval(() => {
      bars.forEach(b => {
        b.style.height = (4 + Math.random() * 26) + 'px';
      });
    }, 90);
  }

  function stopEq() {
    if (eqTimer) clearInterval(eqTimer);
    eqTimer = null;
    eqContainer.classList.remove('active');
    bars.forEach(b => { b.style.height = '5px'; });
  }

  function startProgressTick() {
    if (progressTimer) clearInterval(progressTimer);
    if (!isPlaying || durationMs <= 0) return;
    progressTimer = setInterval(() => {
      currentMs = Math.min(currentMs + 250, durationMs);
      renderProgress();
    }, 250);
  }

  function renderProgress() {
    const pct = durationMs > 0 ? (currentMs / durationMs) * 100 : 0;
    progressBar.style.width = pct + '%';
    currentTimeEl.textContent = fmt(currentMs);
    totalDurEl.textContent    = fmt(durationMs);
  }

  async function fetchVideoId(query) {
    const apis = [
      async () => {
        const r = await fetch(`https://inv.tux.pizza/api/v1/search?q=${encodeURIComponent(query)}&type=video&fields=videoId`);
        if (!r.ok) return null;
        const d = await r.json();
        return Array.isArray(d) && d.length ? d[0].videoId : null;
      },
      async () => {
        const r = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
        if (!r.ok) return null;
        const d = await r.json();
        if (!d.items || !d.items.length) return null;
        const id = d.items[0].url?.replace('/watch?v=', '');
        return id && id.length === 11 ? id : null;
      }
    ];
    for (const fn of apis) {
      try { const id = await fn(); if (id) return id; } catch (_) {}
    }
    return null;
  }

  async function fetchLRC(artist, track, durationSec) {
    try {
      const r = await fetch(`https://lrclib.net/api/get?artist_name=${encodeURIComponent(artist)}&track_name=${encodeURIComponent(track)}&duration=${Math.round(durationSec)}`);
      if (!r.ok) return null;
      const d = await r.json();
      if (d.syncedLyrics) return d.syncedLyrics;
      if (d.plainLyrics) {
        return d.plainLyrics.split('\n').filter(l => l.trim()).map(l => `[00:00.00]${l}`).join('\n');
      }
    } catch (_) {}
    return null;
  }

  function loadVideo(videoId, startSec) {
    currentVideoId = videoId;
    videoToggleBtn.style.display = 'block';
    if (!ytReady) {
      ytIframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&rel=0&enablejsapi=1&start=${Math.floor(startSec)}`;
      return;
    }
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
      try { ytPlayer.loadVideoById({ videoId, startSeconds: startSec }); ytPlayer.mute(); } catch (_) {}
    }
  }

  function showVideoPanel() {
    videoContainer.style.display = 'block';
    setTimeout(() => videoContainer.classList.add('visible'), 30);
    mainEl.style.opacity = '0';
    bg.style.opacity = '0';
    eqContainer.style.opacity = '0';
    lyricsContainer.classList.remove('visible');
    videoToggleBtn.textContent = '✕ Video Gizle';
    videoVisible = true;
    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
      try { ytPlayer.unMute(); ytPlayer.setVolume(100); unmuteBtn.style.display = 'none'; } catch (_) {}
    } else {
      unmuteBtn.style.display = 'block';
    }
  }

  function hideVideoPanel() {
    videoContainer.classList.remove('visible');
    setTimeout(() => { videoContainer.style.display = 'none'; }, 600);
    mainEl.style.opacity = '1';
    bg.style.opacity = '1';
    if (isPlaying) {
      eqContainer.style.opacity = '1';
      lyricsContainer.classList.add('visible');
    }
    videoToggleBtn.textContent = '▶ Video Göster';
    videoVisible = false;
    unmuteBtn.style.display = 'none';
    if (ytPlayer && typeof ytPlayer.mute === 'function') {
      try { ytPlayer.mute(); } catch (_) {}
    }
  }

  function showPlayer() {
    loginContainer.style.opacity = '0';
    setTimeout(() => { loginContainer.style.display = 'none'; }, 500);
  }

  function showNoTrack() {
    mainEl.style.display = 'none';
    mainEl.classList.remove('visible');
    noTrackEl.style.display = 'flex';
    bg.style.backgroundImage = '';
    stopEq();
    stopLyricSync();
    lyricsContainer.classList.remove('visible');
    if (videoVisible) hideVideoPanel();
    videoToggleBtn.style.display = 'none';
    currentTrackKey = '';
  }

  async function handleTrack(trackData) {
    const name     = trackData.name;
    const artist   = trackData.artist['#text'];
    const img      = trackData.image?.find(i => i.size === 'extralarge')?.['#text'] || '';
    const mbid     = trackData.mbid || '';
    const key      = `${artist}|||${name}`;
    const nowPlaying = trackData['@attr']?.nowplaying === 'true';

    isPlaying = nowPlaying;

    if (!nowPlaying) {
      showNoTrack();
      return;
    }

    noTrackEl.style.display = 'none';
    mainEl.style.display = 'flex';
    setTimeout(() => mainEl.classList.add('visible'), 30);

    songNameEl.textContent = name;
    artistEl.textContent   = artist;

    if (img) {
      albumImg.src = img;
      bg.style.backgroundImage = `url(${img})`;
    }

    lyricsContainer.classList.add('visible');
    startEq();
    startProgressTick();

    if (key !== currentTrackKey) {
      currentTrackKey = key;
      currentMs  = 0;
      durationMs = 0;

      renderLyrics([]);
      lyricsContainer.innerHTML = '<div class="lyric-line" style="color:rgba(255,255,255,0.2);text-align:center;">Sözler yükleniyor…</div>';

      const vidQuery = `${artist} - ${name} official music video`;
      const [lrc, vid] = await Promise.all([
        fetchLRC(artist, name, 210),
        fetchVideoId(vidQuery)
      ]);

      if (lrc) renderLyrics(parseLRC(lrc));
      else renderLyrics([]);

      if (vid) loadVideo(vid, 0);
      else { currentVideoId = null; videoToggleBtn.style.display = 'none'; if (videoVisible) hideVideoPanel(); }

      startLyricSync();
    }
  }

  async function poll() {
    try {
      const r = await fetch(`https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks&user=${encodeURIComponent(username)}&api_key=${API_KEY}&format=json&limit=1`);
      if (!r.ok) return;
      const d = await r.json();
      const tracks = d.recenttracks?.track;
      if (!tracks || !tracks.length) { showNoTrack(); return; }
      const latest = Array.isArray(tracks) ? tracks[0] : tracks;
      await handleTrack(latest);
    } catch (_) {}
  }

  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    try {
      ytPlayer = new YT.Player('youtube-player', {
        events: {
          onReady: () => { try { ytPlayer.mute(); } catch (_) {} },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED && currentVideoId) {
              try { ytPlayer.seekTo(0); ytPlayer.playVideo(); } catch (_) {}
            }
          }
        }
      });
    } catch (_) {}
  };

  videoToggleBtn.addEventListener('click', () => {
    if (videoVisible) hideVideoPanel(); else showVideoPanel();
  });

  unmuteBtn.addEventListener('click', () => {
    if (ytPlayer && typeof ytPlayer.unMute === 'function') {
      try { ytPlayer.unMute(); ytPlayer.setVolume(100); } catch (_) {}
    }
    unmuteBtn.style.display = 'none';
  });

  loginBtn.addEventListener('click', () => {
    const val = lfmInput.value.trim();
    if (!val) return;
    username = val;
    localStorage.setItem('lfm_user', username);
    showPlayer();
    poll();
    pollTimer = setInterval(poll, POLL_MS);
  });

  lfmInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });

  window.addEventListener('DOMContentLoaded', () => {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);

    if (username) {
      lfmInput.value = username;
      showPlayer();
      poll();
      pollTimer = setInterval(poll, POLL_MS);
    }
  });
</script>
</body>
</html>
