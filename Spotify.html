<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Playlist MP3 İndirici</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #181818; padding: 25px; border-radius: 12px; width: 420px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid #282828; }
        h2 { color: #1db954; margin-top: 0; }
        .input-group { display: flex; gap: 8px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #282828; color: white; outline: none; }
        input:focus { border-color: #1db954; }
        .paste-btn { background: #333; color: #1db954; border: 1px solid #1db954; padding: 0 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .paste-btn:hover { background: #1db954; color: white; }
        button.action-btn { background: #1db954; color: white; border: none; padding: 12px 25px; border-radius: 20px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
        button.action-btn:hover { background: #1ed760; }
        
        .progress-box { margin-top: 15px; display: none; }
        .progress-bar-bg { background: #333; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { background: #1db954; height: 100%; width: 0%; transition: width 0.3s; }
        
        #list { margin-top: 20px; text-align: left; max-height: 250px; overflow-y: auto; background: #222; padding: 10px; border-radius: 6px; font-size: 0.85em; }
        .song-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .download-btn { color: white; background: #2563eb; padding: 4px 10px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.8em; }
        .loading-text { color: #eab308; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="card">
    <h2>Playlist MP3 İndir</h2>
    
    <div class="input-group">
        <input type="text" id="spotifyUrl" placeholder="Spotify Linki Yapıştırın..." oninput="extractCleanUrl()">
        <button class="paste-btn" onclick="pasteFromClipboard()" title="Panodan Temiz Yapıştır">Yapıştır</button>
    </div>

    <button class="action-btn" id="btnStart" onclick="startProcess()">Dönüştürmeyi Başlat</button>
    
    <div class="progress-box" id="progressBox">
        <div id="statusText" style="font-size:0.85em; color:#bbb;">Hazırlanıyor...</div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
// Metin içindeki bplist / çöp karakterleri temizleyip SADECE Spotify URL'sini çeken Regex
function parseSpotifyUrl(text) {
    const regex = /(https?:\/\/open\.spotify\.com\/(track|playlist)\/[a-zA-Z0-9]+)/;
    const match = text.match(regex);
    return match ? match[0] : '';
}

// Input alanına elle yapıştırılırsa anında ayıklar
function extractCleanUrl() {
    const input = document.getElementById('spotifyUrl');
    const clean = parseSpotifyUrl(input.value);
    if (clean) {
        input.value = clean;
    }
}

// "Yapıştır" butonuna basınca panoyu okur ve binary çöpü temizleyip saf URL koyar
async function pasteFromClipboard() {
    try {
        const text = await navigator.clipboard.readText();
        const cleanUrl = parseSpotifyUrl(text);
        if (cleanUrl) {
            document.getElementById('spotifyUrl').value = cleanUrl;
        } else {
            alert("Panoda geçerli bir Spotify linki bulunamadı!");
        }
    } catch (err) {
        alert("Pano erişim izni alınamadı. Lütfen elle yapıştırın.");
    }
}

async function fetchWithTimeout(resource, options = {}) {
    const { timeout = 8000 } = options;
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    const response = await fetch(resource, { ...options, signal: controller.signal });
    clearTimeout(id);
    return response;
}

async function startProcess() {
    let rawInput = document.getElementById('spotifyUrl').value;
    let url = parseSpotifyUrl(rawInput);
    
    const list = document.getElementById('list');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');
    const btnStart = document.getElementById('btnStart');

    if (!url) {
        alert("Lütfen geçerli bir Spotify linki yapıştırın!");
        return;
    }

    document.getElementById('spotifyUrl').value = url; // Kutuyu da temiz haliyle güncelle
    btnStart.disabled = true;
    list.innerHTML = "";
    progressBox.style.display = "block";
    progressBar.style.width = "0%";
    statusText.innerText = "Spotify verisi çekiliyor...";

    try {
        const corsProxy = 'https://api.allorigins.win/get?url=';
        const res = await fetch(corsProxy + encodeURIComponent(url));
        const data = await res.json();

        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        let songs = [];
        
        if (url.includes('/playlist/')) {
            // Meta etiketlerinden ve title'dan şarkı/playlist adını yakala
            const ogDescription = doc.querySelector('meta[property="og:description"]')?.content;
            const mainTitle = doc.querySelector('title')?.innerText.replace(' | Spotify', '');

            if (ogDescription && ogDescription.includes('·')) {
                // Spotify playlist meta açıklamasından şarkıları ayrıştır
                const trackList = ogDescription.split('·')[1] || ogDescription;
                songs = trackList.split(',').map(s => s.trim()).filter(s => s.length > 0);
            } 
            
            if (songs.length === 0 && mainTitle) {
                songs.push(mainTitle);
            }
        } else {
            const trackTitle = doc.querySelector('meta[property="og:title"]')?.content;
            if (trackTitle) songs.push(trackTitle);
        }

        if (songs.length === 0) {
            statusText.innerText = "Şarkı bilgisi okunamadı. Linki kontrol edin.";
            btnStart.disabled = false;
            return;
        }

        statusText.innerText = `Toplam ${songs.length} şarkı bulundu...`;

        // Şarkıları Sırayla İşle
        for (let i = 0; i < songs.length; i++) {
            const songName = songs[i];
            
            const itemDiv = document.createElement('div');
            itemDiv.className = 'song-item';
            itemDiv.id = `song-${i}`;
            itemDiv.innerHTML = `
                <span>${songName}</span>
                <span class="loading-text">Dönüştürülüyor...</span>
            `;
            list.appendChild(itemDiv);

            const percent = Math.round(((i + 1) / songs.length) * 100);
            progressBar.style.width = percent + "%";
            statusText.innerText = `İşleniyor: ${i + 1} / ${songs.length}`;

            try {
                const apiRes = await fetchWithTimeout('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: `https://www.youtube.com/results?search_query=${encodeURIComponent(songName + " audio")}`,
                        downloadMode: 'audio',
                        audioFormat: 'mp3'
                    })
                });

                const apiData = await apiRes.json();

                if (apiData.url) {
                    document.getElementById(`song-${i}`).innerHTML = `
                        <span>${songName}</span>
                        <a href="${apiData.url}" class="download-btn" target="_blank" download>MP3 İndir</a>
                    `;
                } else {
                    document.getElementById(`song-${i}`).querySelector('.loading-text').innerText = "Bulunamadı";
                }
            } catch (err) {
                document.getElementById(`song-${i}`).querySelector('.loading-text').innerText = "Hata/CORS";
            }

            // Sunucunun IP ban atmaması için bekleme süresi
            await new Promise(resolve => setTimeout(resolve, 1200));
        }

        statusText.innerText = "İşlem Tamamlandı!";

    } catch (err) {
        console.error(err);
        statusText.innerText = "Spotify bağlantı hatası yaşandı.";
    }

    btnStart.disabled = false;
}
</script>

</body>
</html>
