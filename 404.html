<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — dxles.eu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c8a96e;
      --gold-dim: rgba(200,169,110,0.12);
      --gold-glow: rgba(200,169,110,0.05);
      --text: #ede8df;
      --sub: rgba(237,232,223,0.45);
      --bg: #080806;
      --line: rgba(255,255,255,0.06);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 80%);
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 50% 40% at 50% 50%, rgba(200,169,110,0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      background: rgba(8,8,6,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .nav-logo {
      font-family: 'Syne', sans-serif;
      font-size: 1.1rem; font-weight: 800;
      color: var(--text); text-decoration: none;
    }
    .nav-logo span { color: var(--gold); }

    .container {
      position: relative; z-index: 1;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 0.8s ease 0.2s both;
    }

    .error-tag {
      font-size: 0.52rem; letter-spacing: 0.5em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 1.5rem;
      display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    }
    .error-tag::before, .error-tag::after {
      content: ''; width: 20px; height: 1px; background: var(--gold);
    }

    .error-num {
      font-family: 'Syne', sans-serif;
      font-size: clamp(7rem, 22vw, 14rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 0.9;
      color: transparent;
      -webkit-text-stroke: 1px rgba(200,169,110,0.35);
      position: relative;
      animation: glitch 7s infinite;
      user-select: none;
    }

    .error-num::before,
    .error-num::after {
      content: '404';
      position: absolute; left: 0; top: 0; width: 100%;
    }
    .error-num::before {
      color: transparent;
      -webkit-text-stroke: 1px rgba(255,80,80,0.4);
      animation: glitch-r 7s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
    }
    .error-num::after {
      color: transparent;
      -webkit-text-stroke: 1px rgba(0,200,200,0.3);
      animation: glitch-b 7s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
    }

    .error-msg {
      font-size: 0.65rem; line-height: 1.9;
      color: var(--sub); letter-spacing: 0.08em;
      margin: 1.5rem 0 2.5rem;
    }

    .home-btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.52rem; letter-spacing: 0.28em; text-transform: uppercase;
      text-decoration: none;
      padding: 0.8rem 1.8rem;
      border: 1px solid rgba(200,169,110,0.3);
      color: var(--gold);
      background: var(--gold-glow);
      border-radius: 2px;
      transition: all 0.25s;
    }
    .home-btn:hover {
      background: var(--gold-dim);
      color: var(--text);
      transform: translateY(-2px);
    }
    .home-btn svg {
      width: 12px; height: 12px;
      stroke: currentColor; fill: none; stroke-width: 1.8;
    }
    
    .scanlines {
      position: fixed; inset: 0; z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.03) 3px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
    }

    @keyframes glitch {
      0%, 85%, 100% { transform: skew(0deg); }
      86% { transform: skew(2.5deg) translateX(2px); }
      88% { transform: skew(-1.5deg) translateX(-2px); }
      90% { transform: skew(0.5deg); }
    }
    @keyframes glitch-r {
      0%, 85%, 100% { transform: translateX(0); opacity: 0; }
      86% { transform: translateX(4px); opacity: 1; }
      88% { transform: translateX(-2px); opacity: 1; }
      90% { transform: translateX(0); opacity: 0; }
    }
    @keyframes glitch-b {
      0%, 85%, 100% { transform: translateX(0); opacity: 0; }
      86% { transform: translateX(-4px); opacity: 1; }
      88% { transform: translateX(2px); opacity: 1; }
      90% { transform: translateX(0); opacity: 0; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="scanlines"></div>

  <nav>
    <a href="/" class="nav-logo">dx<span>les</span></a>
  </nav>

  <div class="container">
    <div class="error-tag">Sayfa bulunamadı</div>
    <div class="error-num">404</div>
    <p class="error-msg">Aradığın sayfa bu evrende mevcut değil.<br>Silindi, taşındı ya da hiç olmadı.</p>
    <a href="/" class="home-btn">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Ana sayfaya dön
    </a>
  </div>
</body>
</html>
