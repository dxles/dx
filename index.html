<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bakımdayız — dxles.eu</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <style>
    :root {
      --pop-green: #00c853;
      --bg: #e3e1e1;
      --text: #000;
      --subtext: #666;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem 2rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--subtext);
    }
    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--pop-green);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    main {
      max-width: 620px;
      margin: 4rem 0;
    }
    h1 {
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.03em;
      margin-top: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 em { font-style: normal; color: #888; }
    p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--subtext);
      margin-bottom: 2rem;
    }
    .terminal-box {
      background: #000;
      color: #ccbeb8;
      font-family: monospace;
      font-size: 12px;
      padding: 1.2rem 1.5rem;
      border-radius: 12px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .terminal-box .green { color: var(--pop-green); }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      background: #000;
      color: #ccbeb8;
      padding: 12px 24px;
      border-radius: 100px;
      font-size: 13px;
      letter-spacing: 0.05em;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .contact-btn:hover { opacity: 0.7; }
    footer {
      font-size: 12px;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #ccc;
      padding-top: 1.5rem;
    }
    footer a { color: inherit; text-decoration: none; border-bottom: 1px solid #888; }
    footer a:hover { opacity: 0.6; }
  </style>
</head>
<body>

  <header>
    <div class="status-badge">Sistem Güncellemesi / Maintenance</div>
  </header>

  <main>
    <h1>Sistem Bakımda<em>.</em></h1>
    <p>dxles.eu altyapısında güncellemeler ve güvenlik optimizasyonları yapılıyor. Kısa süre içinde tekrar yayında olacağım.</p>

    <div class="terminal-box">
      <div>> status: <span class="green">UPDATING_CORE</span></div>
      <div>> target: dxles.eu</div>
      <div>> ETA: yakında / soon</div>
    </div>

    <a href="mailto:dxxlxdxxx@gmail.com" class="contact-btn">Bana Ulaş →</a>
  </main>

  <footer>
    <span>nosecondus · Bavaria, DE</span>
    <a href="https://github.com/35rl" target="_blank" rel="noopener">GitHub</a>
  </footer>

</body>
</html>
